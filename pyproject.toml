[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enrichrapi-mcp"
version = "0.2.0"
description = "MCP server for Enrichr — 50 billed utilities (validate emails, parse phones, geolocate IPs, decode JWTs, sign webhooks, parse cron, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enrichr", email = "hello@enrichrapi.dev" }]
keywords = [
    "mcp", "model-context-protocol", "enrichr", "enrichrapi",
    "enrichrapi-mcp", "ai-tools", "agent-tools", "data-enrichment",
    "validation", "jwt", "webhook", "cron", "currency-conversion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://enrichrapi.dev"
Documentation = "https://enrichrapi.dev/llms.txt"
Repository = "https://github.com/crisjonblvx/enrichrapi-mcp"
Issues = "https://github.com/crisjonblvx/enrichrapi-mcp/issues"

[project.scripts]
enrichrapi-mcp = "enrichrapi_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["enrichrapi_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/enrichrapi_mcp",
  "/README.md",
  "/LICENSE",
]
